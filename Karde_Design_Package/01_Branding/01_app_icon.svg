<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ibg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181C26"/>
      <stop offset="100%" stop-color="#0A0C11"/>
    </linearGradient>
    <linearGradient id="ik" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E7D4A0"/>
      <stop offset="55%" stop-color="#C9A961"/>
      <stop offset="100%" stop-color="#9C7C41"/>
    </linearGradient>
    <radialGradient id="iglow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2BD1C4" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#2BD1C4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#ibg)"/>
  <rect width="512" height="512" rx="112" fill="url(#iglow)"/>
  <rect x="6" y="6" width="500" height="500" rx="108" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
  <!-- vault ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#2BD1C4" stroke-opacity="0.30" stroke-width="3"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ik)" stroke-opacity="0.9" stroke-width="4" stroke-dasharray="4 14" stroke-linecap="round"/>
  <!-- K monogram forming a shield/keyhole -->
  <g transform="translate(256,256)">
    <path d="M-58 -110 V110" stroke="url(#ik)" stroke-width="34" stroke-linecap="round"/>
    <path d="M-58 6 L54 -110" stroke="url(#ik)" stroke-width="34" stroke-linecap="round"/>
    <path d="M-58 6 L54 118" stroke="url(#ik)" stroke-width="34" stroke-linecap="round"/>
